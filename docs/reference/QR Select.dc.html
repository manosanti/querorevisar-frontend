<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
</helmet>
<div ref="{{ rootRef }}" style="display: flex; flex-direction: column; gap: 6px; font-family: Figtree, -apple-system, sans-serif; color: #222; font-weight: 500; min-width: 0;">
  <sc-if value="{{ hasLabel }}" hint-placeholder-val="{{ true }}">
    <span style="font-size: 13.5px; font-weight: 600;">{{ label }}</span>
  </sc-if>
  <div style="position: relative;">
  <button type="button" onClick="{{ toggle }}" onKeyDown="{{ onTriggerKey }}" disabled="{{ disabled }}" aria-haspopup="listbox" aria-expanded="{{ open }}" style="height: 52px; width: 100%; display: flex; align-items: center; gap: 10px; padding: 0 14px 0 {{ padLeft }}; border-radius: 8px; border: {{ triggerBorder }}; box-shadow: {{ triggerShadow }}; background: {{ triggerBg }}; text-align: left; cursor: {{ cursor }}; font: inherit; color: inherit; opacity: {{ opacity }}; transition: border-color .15s, box-shadow .15s;">
    <sc-if value="{{ selIcon }}" hint-placeholder-val="{{ false }}">
      <img src="{{ selIcon }}" alt="" style="width: 34px; height: 34px; object-fit: contain; flex: none;">
    </sc-if>
    <span style="flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 16px; color: {{ valueColor }};">{{ display }}</span>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6a6a6a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none; transition: transform .2s; transform: {{ chev }};"><path d="m6 9 6 6 6-6"></path></svg>
  </button>
  <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 50; background: #fff; border-radius: 14px; border: 1px solid #dddddd; box-shadow: rgba(0,0,0,.02) 0 0 0 1px, rgba(0,0,0,.04) 0 2px 6px 0, rgba(0,0,0,.12) 0 8px 24px 0; overflow: hidden;">
      <sc-if value="{{ searchable }}" hint-placeholder-val="{{ true }}">
        <div style="padding: 8px; border-bottom: 1px solid #dddddd;">
          <div style="display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 12px; border-radius: 8px; border: 1px solid #dddddd; background: #fff;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6a6a6a" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
            <input data-bare="" ref="{{ searchRef }}" value="{{ q }}" onChange="{{ onQ }}" onKeyDown="{{ onSearchKey }}" placeholder="{{ searchPlaceholder }}" aria-label="Buscar" style="flex: 1; min-width: 0; border: 0; outline: 0; background: none; font: inherit; font-size: 15px; color: #222; box-shadow: none;">
          </div>
        </div>
      </sc-if>
      <div role="listbox" style="max-height: 264px; overflow-y: auto; padding: 6px;">
        <sc-for list="{{ items }}" as="o" hint-placeholder-count="4">
          <button type="button" role="option" aria-selected="{{ o.selected }}" onClick="{{ o.pick }}" onMouseEnter="{{ o.hover }}" style="width: 100%; display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 8px 10px; border: 0; border-radius: 10px; background: {{ o.bg }}; text-align: left; cursor: pointer; font: inherit; color: inherit;">
            <sc-if value="{{ o.icon }}" hint-placeholder-val="{{ false }}">
              <img src="{{ o.icon }}" alt="" style="width: 34px; height: 34px; object-fit: contain; flex: none;">
            </sc-if>
            <span style="flex: 1; min-width: 0;">
              <span style="display: block; font-size: 15px; font-weight: {{ o.weight }};">{{ o.label }}</span>
              <sc-if value="{{ o.sub }}" hint-placeholder-val="{{ false }}">
                <span style="display: block; font-size: 13px; color: #6a6a6a;">{{ o.sub }}</span>
              </sc-if>
            </span>
            <sc-if value="{{ o.selected }}" hint-placeholder-val="{{ false }}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0e5a66" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex: none;"><path d="M20 6 9 17l-5-5"></path></svg>
            </sc-if>
          </button>
        </sc-for>
        <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
          <div style="padding: 18px 10px; text-align: center; font-size: 14px; color: #6a6a6a;">Nada encontrado para "{{ q }}"</div>
        </sc-if>
      </div>
    </div>
  </sc-if>
  </div>
  <sc-if value="{{ hasHelper }}" hint-placeholder-val="{{ false }}">
    <span style="font-size: 13px; color: {{ helperColor }};">{{ helper }}</span>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:420},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Marca&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;placeholder&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Selecione&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;searchPlaceholder&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Buscar&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;value&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;options&quot;:{&quot;editor&quot;:null,&quot;default&quot;:[&quot;Chevrolet&quot;,&quot;Fiat&quot;,&quot;Honda&quot;,&quot;Hyundai&quot;,&quot;Toyota&quot;,&quot;Volkswagen&quot;,&quot;Yamaha&quot;],&quot;tsType&quot;:&quot;Array&lt;string | {value: string, label: string, sub?: string, icon?: string}&gt;&quot;},&quot;searchable&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;helper&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;error&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;disabled&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(value: string, option: object) =&gt; void&quot;}}">
const norm = s => (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
class Component extends DCLogic {
  state = { open: false, q: '', hi: 0 };
  rootRef = React.createRef();
  searchRef = React.createRef();
  componentDidMount() {
    this.onDoc = e => { if (this.state.open && this.rootRef.current && !this.rootRef.current.contains(e.target)) this.setState({ open: false }); };
    document.addEventListener('mousedown', this.onDoc);
    document.addEventListener('touchstart', this.onDoc);
  }
  componentWillUnmount() { document.removeEventListener('mousedown', this.onDoc); document.removeEventListener('touchstart', this.onDoc); }
  componentDidUpdate(pp, ps) { if (this.state.open && !ps.open && this.searchRef.current) this.searchRef.current.focus(); }
  opts() { return (this.props.options || []).map(o => typeof o === 'string' ? { value: o, label: o } : o); }
  filtered() { const q = norm(this.state.q); return this.opts().filter(o => !q || norm(o.label + ' ' + (o.sub || '')).indexOf(q) >= 0); }
  pick(o) { this.setState({ open: false, q: '' }); if (this.props.onChange) this.props.onChange(o.value, o); }
  renderVals() {
    const p = this.props, st = this.state;
    const opts = this.opts(); const sel = opts.find(o => o.value === p.value);
    const f = this.filtered(); const hi = Math.min(st.hi, f.length - 1);
    const err = !!p.error;
    const searchable = p.searchable ?? opts.length > 6;
    return {
      rootRef: this.rootRef, searchRef: this.searchRef,
      label: p.label, hasLabel: !!p.label, disabled: !!p.disabled, opacity: p.disabled ? 0.45 : 1, cursor: p.disabled ? 'not-allowed' : 'pointer',
      helper: p.error || p.helper, hasHelper: !!(p.error || p.helper), helperColor: err ? '#c13515' : '#6a6a6a',
      open: st.open, chev: st.open ? 'rotate(180deg)' : 'none', panelTop: p.label ? 'calc(100% - ' + (p.error || p.helper ? 22 : 0) + 'px + 6px)' : 'calc(100% + 6px)',
      triggerBorder: err ? '1px solid #c13515' : st.open ? '1px solid #0e5a66' : '1px solid #dddddd',
      triggerShadow: err ? '0 0 0 1px #c13515' : st.open ? '0 0 0 1px #0e5a66' : 'none',
      triggerBg: p.disabled ? '#f7f7f7' : '#fff',
      selIcon: sel && sel.icon ? sel.icon : null, padLeft: sel && sel.icon ? '8px' : '16px',
      display: sel ? sel.label : (p.placeholder || 'Selecione'), valueColor: sel ? '#222' : '#929292',
      searchable, q: st.q, searchPlaceholder: p.searchPlaceholder || 'Buscar',
      onQ: e => this.setState({ q: e.target.value, hi: 0 }),
      toggle: () => !p.disabled && this.setState({ open: !st.open, q: '', hi: Math.max(0, f.findIndex(o => o.value === p.value)) }),
      onTriggerKey: e => { if (e.key === 'ArrowDown' && !st.open) { e.preventDefault(); this.setState({ open: true }); } },
      onSearchKey: e => {
        if (e.key === 'Escape') this.setState({ open: false });
        else if (e.key === 'ArrowDown') { e.preventDefault(); this.setState({ hi: Math.min(f.length - 1, hi + 1) }); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); this.setState({ hi: Math.max(0, hi - 1) }); }
        else if (e.key === 'Enter' && f[hi]) { e.preventDefault(); this.pick(f[hi]); }
      },
      items: f.map((o, i) => ({ label: o.label, sub: o.sub || null, icon: o.icon || null, selected: o.value === p.value,
        weight: o.value === p.value ? 600 : 500, bg: i === hi ? '#f7f7f7' : 'transparent',
        pick: () => this.pick(o), hover: () => this.state.hi !== i && this.setState({ hi: i }) })),
      empty: f.length === 0
    };
  }
}
</script>
</body>
</html>
