<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>QueroRevisar</title>
    <meta name="description" content="Controle de manutenção do seu carro ou moto. Registre as trocas e receba alertas antes de vencer." />
    <meta name="theme-color" content="#125865" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="QueroRevisar" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Figtree without blocking the first render (display=swap + preload, applied when loaded). -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" /></noscript>
  </head>
  <body>
    <div id="root">
      <!-- Static splash painted before the JS loads; React replaces it on the first render. -->
      <div class="qr-splash"><img src="/brand/icone.webp" width="84" height="84" alt="QueroRevisar" fetchpriority="high" /></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
