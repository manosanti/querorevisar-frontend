# F13.4 — monthly restore drill: latest backup → temporary Postgres → migrations check + API test suite.
# "A backup that was never restored does not count" (Arquitetura v2 §18).
# Needs BACKUP_AGE_PRIVATE_KEY in the "restore-drill" environment (see PENDENCIAS.md for the trade-off).
name: restore-test

on:
  schedule:
    - cron: '0 7 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: restore-drill
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client and age
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 age
      - name: Restore the latest backup into the temporary database
        env:
          AGE_IDENTITY: ${{ secrets.BACKUP_AGE_PRIVATE_KEY }}
          TARGET_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: bash infra/backup/restore.sh
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: API test suite still passes (fresh database)
        run: ./gradlew :apps:api:check --console=plain
