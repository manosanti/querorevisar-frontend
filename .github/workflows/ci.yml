# F13.1 — pull requests and pushes: lint, typecheck and tests of what changed, API tests on a real Postgres
# (Testcontainers), contract check of the generated client, web/landing build and a Cloudflare Pages preview.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint, typecheck and test (only what changed on PRs)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm turbo run lint typecheck test --filter="...[origin/${{ github.base_ref }}]"
          else
            pnpm turbo run lint typecheck test
          fi
      - run: pnpm check:colors
      - name: Fixtures are in sync with the reference logic
        run: |
          pnpm fixtures:gen
          git diff --exit-code fixtures/
      - name: Build web and landing
        run: pnpm turbo run build --filter=@qr/web --filter=@qr/landing
        env:
          VITE_RELEASE: ${{ github.sha }}
          VITE_API_URL: ${{ vars.DEV_API_URL }}
          VITE_SUPABASE_URL: ${{ vars.DEV_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.DEV_SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7
      - name: Cloudflare Pages preview
        if: github.event_name == 'pull_request' && env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name=querorevisar-app --branch=pr-${{ github.event.number }}

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: API tests (JVM, Postgres via Testcontainers)
        run: ./gradlew :apps:api:check --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-reports
          path: apps/api/build/reports
          retention-days: 7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated client matches the API (springdoc snapshot written by the test suite)
        run: |
          pnpm api:gen --from apps/api/build/openapi.json
          git diff --exit-code packages/api-client

  e2e:
    # Full stack on the runner (embedded Postgres + API in mock mode + web), only after merges to keep CI minutes low.
    if: github.event_name == 'push'
    needs: [typescript, api]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @qr/web exec playwright install --with-deps chromium
      - name: Start the local stack (embedded Postgres, dev auth, mock payments)
        run: |
          node infra/scripts/dev-all.mjs --embedded > dev-all.log 2>&1 &
          for i in $(seq 1 120); do curl -fsS http://localhost:5173 >/dev/null && break; sleep 5; done
          curl -fsS http://localhost:8080/actuator/health
        env:
          FIPE_MODE: mock
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            dev-all.log
          retention-days: 7
